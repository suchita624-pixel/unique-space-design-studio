<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B529E" />
      <stop offset="50%" stop-color="#4A256E" />
      <stop offset="100%" stop-color="#2D1147" />
    </linearGradient>
    <linearGradient id="lavenderGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BCA4D9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E4D7F5" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378" />
      <stop offset="100%" stop-color="#B88E3E" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4A256E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Logo Emblem -->
  <g transform="translate(4, 4)" filter="url(#softGlow)">
    <!-- Outer Circular Ring with subtle gold/lavender stroke -->
    <circle cx="26" cy="26" r="25" fill="url(#purpleGrad)" stroke="url(#goldAccent)" stroke-width="1.5"/>
    
    <!-- Geometric Overlay Patterns (inspired by the brand mark) -->
    <circle cx="26" cy="26" r="18" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="2 2" stroke-width="1" fill="none"/>
    <circle cx="20" cy="22" r="14" fill="url(#lavenderGlow)" />
    <circle cx="32" cy="30" r="12" fill="#9067B7" fill-opacity="0.4" />
    <circle cx="26" cy="26" r="8" stroke="url(#goldAccent)" stroke-width="1.2" fill="none"/>
    
    <!-- Central Monogram / Geometry -->
    <path d="M21 21 L21 31 L27 31 L27 21" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="31" cy="21" r="1.5" fill="#E5C378"/>
    <path d="M28 26 H33 M28 30 H32" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Typography: UNIQUE SPACES -->
  <g transform="translate(68, 14)">
    <text x="0" y="16" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="700" letter-spacing="3.5" fill="#3B185F">
      UNIQUE
    </text>
    <text x="106" y="16" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="18" font-weight="400" letter-spacing="3.5" fill="#724B97">
      SPACES
    </text>
    
    <!-- Subtitle: DESIGN STUDIO -->
    <text x="1" y="30" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="5" fill="#9681AB">
      DESIGN STUDIO
    </text>

    <!-- Tiny decorative accent dot in gold -->
    <circle cx="160" cy="27" r="2" fill="url(#goldAccent)" />
    <line x1="126" y1="27" x2="155" y2="27" stroke="url(#goldAccent)" stroke-width="0.8" stroke-opacity="0.8" />
  </g>
</svg>

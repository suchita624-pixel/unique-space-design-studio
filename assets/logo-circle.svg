<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="circPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8056A8" />
      <stop offset="50%" stop-color="#4E2777" />
      <stop offset="100%" stop-color="#2C0F4A" />
    </linearGradient>
    <linearGradient id="circLavenderGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5B1E0" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#EDE4F8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="circGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D48B" />
      <stop offset="100%" stop-color="#C59B46" />
    </linearGradient>
    <filter id="circShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B185F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#circShadow)">
    <!-- Main Circle -->
    <circle cx="50" cy="50" r="46" fill="url(#circPurpleGrad)" stroke="url(#circGoldAccent)" stroke-width="2.5"/>
    
    <!-- Geometric Overlay Rings -->
    <circle cx="50" cy="50" r="38" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="3 3" stroke-width="1.2" fill="none"/>
    <circle cx="40" cy="42" r="28" fill="url(#circLavenderGlow)" />
    <circle cx="62" cy="58" r="24" fill="#9C77C4" fill-opacity="0.35" />
    <circle cx="50" cy="50" r="16" stroke="url(#circGoldAccent)" stroke-width="1.5" fill="none"/>

    <!-- Geometric Brand Monogram U & S Structure -->
    <path d="M38 38 L38 58 Q38 64 48 64 Q58 64 58 58 L58 38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M62 40 C62 36, 52 35, 50 42 C48 48, 64 50, 62 58 C60 64, 48 64, 46 60" stroke="url(#circGoldAccent)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>
    
    <circle cx="62" cy="38" r="2.5" fill="#F3D48B"/>
  </g>
</svg>
